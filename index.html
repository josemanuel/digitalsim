<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulador de Lógica Digital</title>
<style>
  :root {
    --bg: #0a0f0d;
    --panel: #101613;
    --panel-border: #223028;
    --grid-line: rgba(120, 160, 140, 0.05);
    --text: #d8e2dc;
    --text-muted: #6f8279;
    --accent-green: #2ecc71;
    --accent-amber: #e6b800;
    --accent-blue: #6b7fd7;
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  .page {
    max-width: 1800px;
    margin: 0 auto;
    padding: 20px 24px 32px;
  }

  header {
    margin-bottom: 20px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 18px;
  }

  .ctrl-btn {
    font-family: var(--mono);
    background: #16201b;
    color: var(--text);
    border: 1px solid #2c4034;
    border-bottom: 3px solid #2c4034;
    border-radius: 4px;
    padding: 10px 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform 0.05s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .ctrl-btn:hover {
    color: var(--accent-green);
    border-color: #3a5a48;
  }

  .ctrl-btn:active {
    transform: translateY(2px);
    border-bottom-width: 1px;
  }

  .legend {
    display: flex;
    gap: 18px;
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }


  .examples-select {
    font-family: var(--mono);
    background: #16201b;
    color: var(--text);
    border: 1px solid #2c4034;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
  }

  .editor-layout {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .palette-col, .props-col {
    flex: 0 0 220px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Árbol de categorías de la paleta: todas las categorías siempre
     visibles como cabeceras, cada una plegable/desplegable por
     separado, con un color propio (mismo espíritu que la referencia que
     pidió el usuario) en vez del <select> de una sola categoría a la vez
     que había antes. */
  .palette-tree {
    display: flex;
    flex-direction: column;
    max-height: 75vh;
    overflow-y: auto;
    padding-right: 2px;
  }

  .category-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    user-select: none;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    font-family: var(--mono);
  }

  .category-header:hover { background: rgba(255,255,255,0.05); }

  .category-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .category-label {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .category-chevron {
    font-size: 9px;
    color: var(--text-muted);
    transition: transform 0.15s ease;
    flex: 0 0 auto;
  }

  .category-chevron.open { transform: rotate(90deg); }

  .category-items {
    display: none;
    flex-direction: column;
    gap: 2px;
    padding: 2px 0 6px 22px;
  }

  .category-items.open { display: flex; }

  .palette-btn {
    font-family: var(--mono);
    background: transparent;
    color: var(--text-muted);
    border: none;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 11px;
    text-align: left;
    cursor: pointer;
    transition: background 0.1s ease, color 0.1s ease;
  }

  .palette-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }

  .canvas-col {
    flex: 1 1 auto;
    min-width: 0;
  }

  #editor-schematic {
    background: #121212;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    overflow: hidden;
    height: min(560px, 65vh);
    position: relative;
    cursor: crosshair;
    user-select: none;
    touch-action: none; /* el lienzo maneja sus propios gestos táctiles (arrastrar/pellizcar zoom); que el navegador no se los quede para hacer scroll de la página */
  }

  #editor-schematic svg { display: block; }

  .editor-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    position: relative;
  }

  .menu {
    position: relative;
  }

  .menu-btn {
    font-family: var(--mono);
    background: transparent;
    color: var(--accent-blue);
    border: none;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .menu-btn:hover, .menu-btn[aria-expanded="true"] {
    background: rgba(107, 127, 215, 0.12);
    color: #93a3ea;
  }

  .menu-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px;
    flex-direction: column;
    gap: 6px;
    min-width: 190px;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .menu-dropdown.open {
    display: flex;
  }

  .menu-dropdown .ctrl-btn, .menu-dropdown .examples-select {
    width: 100%;
    text-align: left;
  }

  #props {
    background: #0d1411;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 10px;
    font-size: 11px;
    color: var(--text-muted);
    min-height: 80px;
  }

  .props-title {
    color: var(--accent-green);
    margin-bottom: 8px;
    word-break: break-all;
  }

  .props-row {
    display: block;
    margin-bottom: 6px;
    color: var(--text);
  }

  .props-row input {
    font-family: var(--mono);
    background: #16201b;
    color: var(--text);
    border: 1px solid #2c4034;
    border-radius: 3px;
    padding: 2px 6px;
    width: 70px;
  }

  #editor-status {
    min-height: 16px;
    color: var(--accent-amber);
    font-size: 11px;
    margin-bottom: 8px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 22px 24px;
  }

  .modal-box h2 {
    margin: 0 0 14px;
    font-size: 16px;
    color: var(--accent-green);
  }

  .modal-box h3 {
    margin: 18px 0 8px;
    font-size: 13px;
    color: var(--accent-blue);
  }

  .modal-box p, .modal-box li {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-muted);
  }

  .modal-box ul {
    margin: 0 0 10px;
    padding-left: 20px;
  }

  .modal-box .ctrl-btn {
    margin-top: 16px;
  }
  @media (max-width: 700px) {
    .editor-layout {
      flex-direction: column;
    }
    .palette-col, .props-col {
      flex: 1 1 auto;
      width: 100%;
    }
    .palette-tree {
      max-height: 200px;
    }
    #editor-schematic {
      height: min(420px, 55vh);
    }
    .menu-dropdown {
      left: 0;
      right: 0;
      min-width: 0;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Simulador de Lógica Digital</h1>
    </header>

    <div class="panel" id="editor-panel">
      <div id="editor-status"></div>
      <div class="editor-toolbar">
        <div class="menu">
          <button class="menu-btn" type="button" data-menu="file" aria-expanded="false">Archivo ▾</button>
          <div class="menu-dropdown" data-menu-panel="file">
            <button class="ctrl-btn" id="new-btn">Nuevo</button>
            <button class="ctrl-btn" id="save-btn">Guardar (.json)</button>
            <button class="ctrl-btn" id="load-btn">Cargar (.json)</button>
            <input type="file" id="load-input" accept="application/json" style="display:none" />
            <select class="examples-select" id="examples-select">
              <option value="">Ejemplos…</option>
            </select>
          </div>
        </div>
        <div class="menu">
          <button class="menu-btn" type="button" data-menu="edit" aria-expanded="false">Editar ▾</button>
          <div class="menu-dropdown" data-menu-panel="edit">
            <button class="ctrl-btn" id="undo-btn">Deshacer</button>
            <button class="ctrl-btn" id="redo-btn">Rehacer</button>
            <button class="ctrl-btn" id="copy-btn">Copiar (Ctrl+C)</button>
            <button class="ctrl-btn" id="paste-btn">Pegar (Ctrl+V)</button>
            <button class="ctrl-btn" id="delete-btn">Borrar selección</button>
            <button class="ctrl-btn" id="rotate-btn">Rotar 90° (R)</button>
            <button class="ctrl-btn" id="reset-view-btn">Centrar vista</button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-btn" type="button" data-menu="run" aria-expanded="false">Ejecutar ▾</button>
          <div class="menu-dropdown" data-menu-panel="run">
            <button class="ctrl-btn" id="step-btn">Un paso</button>
            <button class="ctrl-btn" id="run-btn">Ejecutar</button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-btn" type="button" data-menu="info" aria-expanded="false">Info ▾</button>
          <div class="menu-dropdown" data-menu-panel="info">
            <button class="ctrl-btn" id="help-btn">Ayuda</button>
            <button class="ctrl-btn" id="docs-btn">Documentación</button>
            <button class="ctrl-btn" id="about-btn">Acerca de</button>
          </div>
        </div>
      </div>
      <div class="editor-layout">
        <div class="palette-col" id="palette"></div>
        <div class="canvas-col"><div id="editor-schematic"></div></div>
        <div class="props-col">
          <div id="props">Sin selección.</div>
          <div class="legend" style="margin-top:0">
            <span><i style="background:#2ecc71"></i> activo</span>
            <span><i style="background:#e6b800"></i> X</span>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // src/core/signal.js
  var VALID_STATES = /* @__PURE__ */ new Set(["0", "1", "X", "Z"]);
  var Signal = class _Signal {
    /**
     * @param {Array<'0'|'1'|'X'|'Z'>} bits - bits[0] = LSB
     */

      if (!Array.isArray(bits) || bits.length === 0) {
        throw new TypeError("Signal requiere un array de bits no vac\xEDo");
      }
      for (const b of bits) {
        if (!VALID_STATES.has(b)) {
          throw new TypeError(`Estado de bit inv\xE1lido: ${JSON.stringify(b)}`);
        }
      }
      this.bits = Object.freeze(bits.slice());
      Object.freeze(this);
    }
    get width() {
      return this.bits.length;
    }
    /** Valor del bit i (0 = LSB). */
    bit(i) {
      if (i < 0 || i >= this.bits.length) {
        throw new RangeError(`\xCDndice de bit fuera de rango: ${i}`);
      }
      return this.bits[i];
    }
    /** Devuelve una nueva Signal con el bit i sustituido por value. */
    withBit(i, value) {
      if (!VALID_STATES.has(value)) {
        throw new TypeError(`Estado de bit inv\xE1lido: ${JSON.stringify(value)}`);
      }
      const next = this.bits.slice();
      next[i] = value;
      return new _Signal(next);
    }
    /** true si todos los bits son '0' o '1' (sin X ni Z). */
    isFullyDefined() {
      return this.bits.every((b) => b === "0" || b === "1");
    }
    /** true si todos los bits son 'Z' (línea no conducida por nadie). */
    isHighZ() {
      return this.bits.every((b) => b === "Z");
    }
    /** true si algún bit es 'X' (desconocido o conflicto). */
    hasUnknown() {
      return this.bits.some((b) => b === "X");
    }
    /**
     * Convierte a número entero sin signo. Devuelve null si algún bit no está
     * completamente definido (X o Z) — nunca se "adivina" un valor numérico
     * para una señal indeterminada, eso ocultaría bugs reales del circuito.
     */
    toNumber() {
      if (!this.isFullyDefined()) return null;
      let value = 0;
      for (let i = this.bits.length - 1; i >= 0; i--) {
        value = value * 2 + (this.bits[i] === "1" ? 1 : 0);
      }
      return value;
    }
    /** Representación de texto MSB primero, p. ej. "10XZ". */
    toBinaryString() {
      return this.bits.slice().reverse().join("");
    }
    equals(other) {
      if (!(other instanceof _Signal)) return false;
      if (other.width !== this.width) return false;
      return this.bits.every((b, i) => b === other.bits[i]);
    }
    clone() {
      return this;
    }
    // ---- Constructores estáticos de conveniencia ----
    /** Señal de N bits en alta impedancia (nadie la está conduciendo). */
    static highZ(width) {
      return new _Signal(new Array(width).fill("Z"));
    }
    /** Señal de N bits completamente desconocida. */
    static unknown(width) {
      return new _Signal(new Array(width).fill("X"));
    }
    /** Señal de N bits a partir de un entero sin signo (trunca al ancho dado). */
    static fromNumber(value, width) {
      if (!Number.isInteger(value) || value < 0) {
        throw new TypeError("fromNumber requiere un entero no negativo");
      }
      const bits = new Array(width);
      let v = value;
      for (let i = 0; i < width; i++) {
        bits[i] = (v & 1) === 1 ? "1" : "0";
        v >>= 1;
      }
      return new _Signal(bits);
    }
    /**
     * Señal a partir de una cadena MSB primero, p. ej. "1010" o "X0Z1".
     * Es la representación "como la escribiría una persona".
     */
    static fromBinaryString(str) {
      if (typeof str !== "string" || str.length === 0) {
        throw new TypeError("fromBinaryString requiere una cadena no vac\xEDa");
      }
      const chars = str.toUpperCase().split("");
      for (const c of chars) {
        if (!VALID_STATES.has(c)) {
          throw new TypeError(`Car\xE1cter de bit inv\xE1lido: ${JSON.stringify(c)}`);
        }
      }
      return new _Signal(chars.reverse());
    }
    /** Señal de 1 bit en nivel alto. Atajo frecuente en tests y componentes. */
    static high() {
      return new _Signal(["1"]);
    }
    /** Señal de 1 bit en nivel bajo. */
    static low() {
      return new _Signal(["0"]);
    }
  };

  // src/core/pin.js
  var PinDirection = Object.freeze({
    INPUT: "INPUT",
    OUTPUT: "OUTPUT",
    INOUT: "INOUT"
  });
  var Pin = class {
    /**
     * @param {object} opts
     * @param {string} opts.id - identificador estable dentro del componente
     * @param {string} opts.name - etiqueta legible ("CLK", "D0", "Q")
     * @param {'INPUT'|'OUTPUT'|'INOUT'} opts.direction
     * @param {number} opts.width - número de bits (1 = señal simple)
     * @param {object} opts.owner - el Component al que pertenece este pin
     */
    constructor({ id, name, direction, width, owner }) {
      if (!Object.values(PinDirection).includes(direction)) {
        throw new TypeError(`Direcci\xF3n de pin inv\xE1lida: ${direction}`);
      }
      if (!Number.isInteger(width) || width < 1) {
        throw new TypeError(`Ancho de pin inv\xE1lido: ${width}`);
      }
      this.id = id;
      this.name = name;
      this.direction = direction;
      this.width = width;
      this.owner = owner;
      this.net = null;
      this._drivenValue = direction === PinDirection.INPUT ? null : Signal.highZ(width);
    }
    get isInput() {
      return this.direction === PinDirection.INPUT || this.direction === PinDirection.INOUT;
    }
    get isOutput() {
      return this.direction === PinDirection.OUTPUT || this.direction === PinDirection.INOUT;
    }
    /** Conecta este pin a una red. La red debe tener el mismo ancho. */
    connect(net) {
      if (net.width !== this.width) {
        throw new Error(
          `No se puede conectar el pin "${this.id}" (ancho ${this.width}) a una red de ancho ${net.width}`
        );
      }
      if (this.net === net) return;
      this.disconnect();
      this.net = net;
      net.addPin(this);
    }
    disconnect() {
      if (!this.net) return;
      const previousNet = this.net;
      this.net = null;
      previousNet.removePin(this);
    }
    /**
     * Valor efectivo visto desde este pin:
     *   - si está conectado, el valor resuelto de su red;
     *   - si es un pin de ENTRADA sin conectar, se considera desconocido
     *     ('X') en vez de asumir 0 — asumir un valor concreto ocultaría
     *     errores reales de circuito (entradas flotantes);
     *   - si es un pin de SALIDA sin conectar, se puede seguir leyendo el
     *     valor que está intentando escribir (útil para depuración/tests).
     */
    read() {
      if (this.net) return this.net.value;
      if (this.direction === PinDirection.INPUT) return Signal.unknown(this.width);
      return this._drivenValue;
    }
    /** Valor que este pin está conduciendo actualmente (uso interno de Net). */
    getDrivenValue() {
      return this._drivenValue;
    }
    /**
     * Publica un nuevo valor en la red asociada. Solo válido para pines de
     * salida o bidireccionales.
     *
     * `resolveNet` (true por defecto) controla si se resuelve la red de
     * inmediato. SimulationEngine lo pone a false cuando aplica, en un
     * mismo instante de simulación, varios pines que cambiaron a la vez
     * como resultado de UNA sola llamada a evaluate() de un componente
     * (p. ej. un Decoder cuyas 16 salidas cambian juntas) — así evita que
     * un componente aguas abajo que lea DOS de esas salidas se reevalúe
     * con una de ellas ya actualizada y la otra todavía no, lo que
     * produciría un glitch/hazard transitorio real (ver la sección 3.2 del
     * documento de arquitectura sobre "delta cycles" de VHDL, que es
     * exactamente el problema que esto evita). El código externo normal
     * (ManualDriver, InputDevice, tests) sigue llamando a write(signal) sin
     * el segundo argumento y se comporta exactamente igual que siempre.
     */
    write(signal, resolveNet = true) {
      if (this.direction === PinDirection.INPUT) {
        throw new Error(`No se puede escribir en el pin de entrada "${this.id}"`);
      }
      if (signal.width !== this.width) {
        throw new Error(
          `Ancho de se\xF1al incompatible en el pin "${this.id}": esperado ${this.width}, recibido ${signal.width}`
        );
      }
      this._drivenValue = signal;
      if (resolveNet && this.net) this.net.resolve();
    }
  };

  // src/core/component.js
  var nextAutoId = 1;
  var Component = class {
    /**
     * @param {object} opts
     * @param {string} [opts.id]
     * @param {string} opts.type - identificador de tipo, p. ej. "AND_GATE"
     * @param {string} [opts.label]
     * @param {object} [opts.params]
     * @param {{x:number,y:number}} [opts.position]
     * @param {number} [opts.rotation] - en grados; solo relevante para la UI,
     *   pero se guarda aquí porque forma parte de lo que hay que serializar.
     * @param {{width:number,height:number}} [opts.size] - override MANUAL del
     *   tamaño de la caja (sin rotar), solo relevante para la UI. `null`/
     *   ausente significa "tamaño automático según el número de pines" (el
     *   comportamiento de siempre) — ver `computeUnrotatedBoxSize` en
     *   src/ui/geometry.js, que es quien de verdad interpreta este campo.
     */
    constructor({
      id,
      type,
      label,
      params = {},
      position = { x: 0, y: 0 },
      rotation = 0,
      size = null
    } = {}) {
      if (!type) {
        throw new TypeError('Component requiere un "type"');
      }
      this.id = id ?? `${type.toLowerCase()}_${nextAutoId++}`;
      this.type = type;
      this.label = label ?? type;
      this.params = { ...params };
      this.position = { ...position };
      this.rotation = rotation;
      this.size = size ? { ...size } : null;
      this.pins = /* @__PURE__ */ new Map();
      this.onCreate();
    }
    // ---- Gestión de pines ----
    /**
     * Crea y registra un pin nuevo en el componente. Las subclases concretas
     * llaman a esto (normalmente desde onCreate u onParamsChanged) para
     * declarar su interfaz de pines a partir de sus parámetros actuales.
     */
    addPin({ id, name, direction, width }) {
      if (this.pins.has(id)) {
        throw new Error(`El componente "${this.id}" ya tiene un pin "${id}"`);
      }
      const pin = new Pin({ id, name, direction, width, owner: this });
      this.pins.set(id, pin);
      return pin;
    }
    /** Elimina un pin (desconectándolo primero de cualquier red). */
    removePin(id) {
      const pin = this.pins.get(id);
      if (!pin) return;
      pin.disconnect();
      this.pins.delete(id);
    }
    getPin(id) {
      const pin = this.pins.get(id);
      if (!pin) {
        throw new Error(`El componente "${this.id}" no tiene un pin "${id}"`);
      }
      return pin;
    }
    get inputPins() {
